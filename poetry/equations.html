<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>是</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Serif:ital,wght@0,300;0,400;1,300&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #F5F0E8;
      color: #2C2420;
      font-family: 'Noto Serif SC', 'Noto Serif', Georgia, serif;
      font-weight: 300;
    }

    #cover {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 2.5s ease-in;
    }

    #cover h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.5em;
      color: #2C2420;
    }

    #cover .line {
      margin-top: 1.5rem;
      width: 3rem;
      height: 1px;
      background-color: #C96A2E;
    }

    #cover .scroll-hint {
      margin-top: 4rem;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: #9A8878;
      animation: pulse 2s ease-in-out infinite;
    }

    #entries {
      max-width: 640px;
      margin: 0 auto;
      padding: 8rem 2rem 12rem;
    }

    .entry {
      margin-bottom: 10rem;
      animation: fadeIn 1s ease-in;
    }

    .entry-date {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: #C96A2E;
      margin-bottom: 2rem;
    }

    .entry-text {
      font-size: clamp(1rem, 3vw, 1.3rem);
      line-height: 2.4;
      color: #2C2420;
      white-space: pre-line;
    }

    .divider {
      width: 1px;
      height: 3rem;
      background-color: #D4C9BC;
      margin: 0 auto 10rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    footer {
      text-align: center;
      padding: 4rem 2rem 8rem;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: #9A8878;
    }

    ::selection { background-color: #C96A2E22; }
  </style>
</head>
<body>

  <section id="cover">
    <h1>是</h1>
    <div class="line"></div>
    <p class="scroll-hint">↓</p>
  </section>

  <section id="entries">

    <div class="entry">
      <div class="entry-date">2026 · 二月十八日</div>
      <div class="entry-text">时间是烫在书页上的烙印</div>
    </div>

    <div class="divider"></div>

    <div class="entry">
      <div class="entry-date">2025 · 一月十八日</div>
      <div class="entry-text">捏住心脏揉挤出来的汁液是樱桃汁</div>
    </div>

    <div class="divider"></div>

    <div class="entry">
      <div class="entry-date">2024 · 十二月九日</div>
      <div class="entry-text">桥是溪流的睫毛</div>
    </div>

    <div class="divider"></div>

    <div class="entry">
      <div class="entry-date">2024 · 七月十五日</div>
      <div class="entry-text">黑夜是天空的刺青</div>
    </div>

    <div class="divider"></div>

    <div class="entry">
      <div class="entry-date">2024 · 七月六日</div>
      <div class="entry-text">淡若浮萍无所依</div>
    </div>

    <div class="divider"></div>

    <div class="entry">
      <div class="entry-date">2024 · 六月二日</div>
      <div class="entry-text">汗毛是皮肤的眼睛</div>
    </div>

    <div class="divider"></div>

    <div class="entry">
      <div class="entry-date">2024 · 一月十二日</div>
      <div class="entry-text">教为什么涩
因为把自己内化的一部分东西给了对方</div>
    </div>

    <div class="divider"></div>

    <div class="entry">
      <div class="entry-date">2024 · 七月十五日</div>
      <div class="entry-text">时间被吃掉了
每一秒都是过去</div>
    </div>

  </section>

  <footer>是</footer>

</body>
</html>
