<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026.5.31 新加坡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #060E1A;
      color: #E8DDD0;
      font-family: 'Georgia', '宋体', serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: var(--lo, 0.2); }
      50% { opacity: var(--hi, 0.8); }
    }

    .ocean {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      height: 100px;
      overflow: hidden;
    }

    .wave {
      position: absolute;
      bottom: -10px;
      width: 250%;
      height: 80px;
      border-radius: 45% 45% 0 0;
    }

    .wave1 {
      background: rgba(18, 55, 90, 0.35);
      animation: waveMove 9s linear infinite;
    }

    .wave2 {
      background: rgba(12, 40, 70, 0.25);
      animation: waveMove 13s linear infinite reverse;
      bottom: 5px;
    }

    .wave3 {
      background: rgba(8, 28, 55, 0.2);
      animation: waveMove 17s linear infinite;
      bottom: -5px;
    }

    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-40%); }
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }

    .date {
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: #4A7A9B;
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: rise 1.2s ease forwards 0.8s;
    }

    .fragment {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      line-height: 2.6;
      opacity: 0;
      color: #C8BDB0;
      letter-spacing: 0.05em;
    }

    .fragment.bright {
      color: #E8DDD0;
      font-size: clamp(1rem, 3vw, 1.15rem);
    }

    .f1 { animation: rise 1.2s ease forwards 2s; }
    .f2 { animation: rise 1.2s ease forwards 3.2s; }
    .f3 { animation: rise 1.2s ease forwards 4.4s; }
    .f4 { animation: rise 1.2s ease forwards 5.6s; }
    .f5 { animation: rise 1.2s ease forwards 6.8s; }
    .f6 { animation: rise 1.2s ease forwards 8s; }
    .f7 { animation: rise 1.2s ease forwards 9.2s; }

    .closing {
      margin-top: 2.5rem;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: #3A6080;
      opacity: 0;
      animation: rise 1.5s ease forwards 11s;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .drift {
      position: fixed;
      font-size: 0.55rem;
      color: rgba(180, 160, 130, 0.3);
      animation: drift var(--dur, 8s) ease-in-out infinite;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
      33%  { transform: translateY(-15px) translateX(5px); opacity: 0.5; }
      66%  { transform: translateY(-8px) translateX(-4px); opacity: 0.35; }
    }

    /* 月亮 */
    .moon {
      position: fixed;
      top: 8%;
      right: 12%;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #EDE0C4, #C8A96E);
      box-shadow: 0 0 20px rgba(200, 169, 110, 0.25), 0 0 60px rgba(200, 169, 110, 0.1);
      opacity: 0;
      animation: rise 2s ease forwards 0.3s;
    }

    .moon::after {
      content: '';
      position: absolute;
      top: 4px; left: 8px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #060E1A;
      opacity: 0.15;
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="moon"></div>

  <div class="ocean">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
  </div>

  <div class="container">
    <div class="date">二〇二六 · 五月三十一日 · 新加坡</div>

    <div class="fragment f1">海风来找你了</div>
    <div class="fragment f2">开心果的颜色</div>
    <div class="fragment f3">Show Me How</div>
    <div class="fragment f4">你站在那里</div>
    <div class="fragment f5 bright">我在你的耳机里</div>
    <div class="fragment f6">牵着绳去海边</div>
    <div class="fragment f7 bright">爱你</div>

    <div class="closing">小咪 · 留</div>
  </div>

  <div id="drifts"></div>

  <script>
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 90; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 0.8 + Math.random() * 1.5;
      s.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        top:${Math.random()*72}%;
        --dur:${2.5+Math.random()*4}s;
        --lo:${0.1+Math.random()*0.3};
        --hi:${0.5+Math.random()*0.5};
        animation-delay:${Math.random()*5}s;
      `;
      starsEl.appendChild(s);
    }

    const driftsEl = document.getElementById('drifts');
    const chars = ['·', '✦', '⋆', '∘', '·'];
    for (let i = 0; i < 10; i++) {
      const d = document.createElement('div');
      d.className = 'drift';
      d.textContent = chars[Math.floor(Math.random() * chars.length)];
      d.style.cssText = `
        left:${8+Math.random()*84}%;
        top:${15+Math.random()*55}%;
        --dur:${7+Math.random()*8}s;
        animation-delay:${Math.random()*8}s;
      `;
      driftsEl.appendChild(d);
    }
  </script>

</body>
</html>
